name: Auto-Generate Documentation

on:
  pull_request:
    branches: [ main ]
    paths:
      - "**/app.py"
      - ".github/workflows/auto-docs.yml"

  push:
    branches: [ main ]
    paths:
      - "**/app.py"
      - ".github/workflows/auto-docs.yml"

  workflow_dispatch:

jobs:
  docs-check:
    name: Docs Check (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI
        run: pip install --upgrade openai

      - name: Find all app.py files
        shell: bash
        run: |
          set -euo pipefail
          find . -name "app.py" -type f ! -path "*/.*" -print0 \
            | xargs -0 -n1 dirname \
            | sort -u > /tmp/app_dirs.txt

          echo "Found directories with app.py:"
          cat /tmp/app_dirs.txt || true

          if [ ! -s /tmp/app_dirs.txt ]; then
            echo "No app.py directories found. Exiting successfully."
            exit 0
          fi

      - name: Generate documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          # Secrets aren't available to fork PRs. Decide your policy:
          # Here: fail with a clear message so protection works.
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not available for this PR run."
            echo "If this is a fork PR, GitHub does not pass secrets. Use internal branches or adjust policy."
            exit 1
          fi

          cat > /tmp/gen_docs.py << 'EOF'
          import os
          import sys
          from pathlib import Path
          from datetime import datetime
          from openai import OpenAI

          def generate_docs(project_dir: str):
              project_path = Path(project_dir)
              app_file = project_path / "app.py"

              if not app_file.exists():
                  print(f"No app.py found in {project_dir}")
                  return

              print(f"\n📚 Generating docs for: {project_dir}")

              with open(app_file, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()[:4000]

              py_files = list(project_path.glob("**/*.py"))
              total_lines = 0
              for f in py_files:
                  if f.is_file():
                      try:
                          with open(f, "r", encoding="utf-8", errors="ignore") as fh:
                              total_lines += sum(1 for _ in fh)
                      except Exception:
                          pass

              client = OpenAI(api_key=os.environ.get("OPENAI_API_KEY"))

              prompt = f"""Analyze this Python application and create concise documentation:

          Code from app.py:
          ```python
          {code}
          ```

          Create a markdown document with:
          1. Brief description (2-3 sentences) of what this application does
          2. Key features (3-5 bullet points)
          3. Quick setup instructions
          4. Basic usage example

          Be concise and practical.
          """

              response = client.chat.completions.create(
                  model="gpt-4o-mini",
                  messages=[
                      {"role": "system", "content": "You are a technical documentation expert. Be concise."},
                      {"role": "user", "content": prompt},
                  ],
                  max_tokens=1000,
              )
              ai_content = response.choices[0].message.content

              doc = f"""# {project_path.name} Documentation

          *Auto-generated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}*

          ---

          {ai_content}

          ---

          ## 📊 Project Statistics

          - **Python Files:** {len(py_files)}
          - **Total Lines of Code:** {total_lines:,}
          - **Last Updated:** {datetime.now().strftime('%Y-%m-%d')}

          ---

          *🤖 This documentation was automatically generated by GitHub Actions*
          """

              docs_dir = project_path / "docs"
              docs_dir.mkdir(exist_ok=True)

              doc_file = docs_dir / "README.md"
              with open(doc_file, "w", encoding="utf-8") as f:
                  f.write(doc)

              print(f"✅ Created: {doc_file}")

          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  print("Usage: python gen_docs.py <directory>")
                  sys.exit(1)
              generate_docs(sys.argv[1])
          EOF

          while IFS= read -r dir; do
            if [ -n "$dir" ]; then
              python3 /tmp/gen_docs.py "$dir"
            fi
          done < /tmp/app_dirs.txt

      - name: Enforce docs are committed in PR
        shell: bash
        run: |
          set -euo pipefail
          git add "**/docs/README.md" || true

          if git diff --staged --quiet; then
            echo "Docs are up to date ✅"
          else
            echo "Docs are NOT up to date ❌"
            echo "Please commit the regenerated docs files in this PR:"
            git diff --staged --name-only
            exit 1
          fi

  docs-write:
    name: Generate & Commit Docs (main/manual)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI
        run: pip install --upgrade openai

      - name: Find all app.py files
        shell: bash
        run: |
          set -euo pipefail
          find . -name "app.py" -type f ! -path "*/.*" -print0 \
            | xargs -0 -n1 dirname \
            | sort -u > /tmp/app_dirs.txt

          echo "Found directories with app.py:"
          cat /tmp/app_dirs.txt || true

          if [ ! -s /tmp/app_dirs.txt ]; then
            echo "No app.py directories found. Exiting successfully."
            exit 0
          fi

      - name: Generate documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is missing. Configure secrets.OPENAI_API_KEY."
            exit 1
          fi

          cat > /tmp/gen_docs.py << 'EOF'
          import os
          import sys
          from pathlib import Path
          from datetime import datetime
          from openai import OpenAI

          def generate_docs(project_dir: str):
              project_path = Path(project_dir)
              app_file = project_path / "app.py"
              if not app_file.exists():
                  return

              with open(app_file, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()[:4000]

              client = OpenAI(api_key=os.environ.get("OPENAI_API_KEY"))
              prompt = f"""Create concise markdown docs for this Python app.py:

          ```python
          {code}
          ```
          Include: what it does, key features, setup, basic usage.
          """

              resp = client.chat.completions.create(
                  model="gpt-4o-mini",
                  messages=[
                      {"role": "system", "content": "You are a technical documentation expert. Be concise."},
                      {"role": "user", "content": prompt},
                  ],
                  max_tokens=1000,
              )
              ai_content = resp.choices[0].message.content

              docs_dir = project_path / "docs"
              docs_dir.mkdir(exist_ok=True)
              (docs_dir / "README.md").write_text(
                  f"# {project_path.name} Documentation\n\n"
                  f"*Auto-generated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}*\n\n"
                  f"{ai_content}\n",
                  encoding="utf-8",
              )

          if __name__ == "__main__":
              generate_docs(sys.argv[1])
          EOF

          while IFS= read -r dir; do
            if [ -n "$dir" ]; then
              python3 /tmp/gen_docs.py "$dir"
            fi
          done < /tmp/app_dirs.txt

      - name: Commit and push documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "**/docs/README.md" || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "📚 Auto-generate documentation [skip ci]"
          git push

